version: '3.8'

services:
  futures-alert:
    build:
      context: .
      dockerfile: Dockerfile
    image: futures-alert:latest
    container_name: futures-alert
    restart: always
    environment:
      # Override config via env if needed (optional)
      # FORCE: 'true'  # forces run outside market hours
    volumes:
      # Mount the conditions.json (and optionally token.txt) from host for easy updates
      - ./conditions.json:/app/conditions.json:ro
      - ./token.txt:/app/token.txt:ro
    # Expose any ports if you add an HTTP health endpoint (optional)
    # ports:
    #   - "8080:8080"
    # Command can be overridden at runtime, default runs main.py with --force
    command: ["python", "main.py", "--force"]
