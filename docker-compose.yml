version: '3.8'

services:
  futures-alert:
    build:
      context: .
      dockerfile: Dockerfile
    image: futures-alert:latest
    container_name: futures-alert
    restart: always
    env_file:
      - .env
    volumes:
      # Mount the database to persist subscribers and alert history
      - ./alerts.db:/app/alerts.db
      # Mount configuration and token files
      - ./conditions.json:/app/conditions.json:ro
      - ./token.txt:/app/token.txt
    # Command can be overridden at runtime, default runs main.py with --force
    command: ["python", "main.py", "--force"]
